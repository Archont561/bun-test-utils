name: auto-release

# Prepare and tag a release on demand. The release version is cut from the
# changesets accumulated on main (ADR 0042): the cut step consumes them with
# `bun run release:version`, and the chore(release) commit carries both the
# manifest bump and the consumed changeset files. The tag is handed explicitly
# to release.yml because pushes made with GITHUB_TOKEN do not start another
# workflow. npm publication remains isolated in release.yml and uses Trusted
# Publishing there.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Cut the version on the runner without committing or publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  cut:
    name: Cut release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The version comes from the pending changesets, not from a dispatch input
      # (ADR 0042). `changeset version` bumps the manifest and deletes the
      # consumed changeset files; a run with no pending changesets has nothing
      # to cut and fails here, before the release gates.
      - name: Cut version from pending changesets
        run: |
          shopt -s nullglob
          pending=()
          for file in .changeset/*.md; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = "README.md" ] && continue
            pending+=("$file")
          done
          if [ ${#pending[@]} -eq 0 ]; then
            echo "::error::no pending changesets on main; a release consumes the changesets accumulated since the last one (ADR 0042)"
            exit 1
          fi
          echo "Consuming ${#pending[@]} changeset(s):"
          printf '  %s\n' "${pending[@]}"
          bun run release:version
          VERSION=$(bun -e 'console.log(require("./packages/bun-test-utils/package.json").version)')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::changesets produced a version that is not strict semver: $VERSION"
            exit 1
          }
          echo "Cut version ${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Playwright's browser directory. Contents are keyed by browser
          # revision, which only moves when the pinned playwright version in
          # the lockfile changes, so the lockfile is the right cache key.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The release gates run the same suite as ci.yml, so they need the same
      # browsers: Chromium for the browser package and Firefox because the
      # headless-firefox proof is mandatory under CI=true (ADR 0033).
      - name: Install browsers
        run: bun run install-browsers --with-deps

      - name: Run release gates
        run: |
          bun run lint
          bun run typecheck
          bun run test:all
          bun run build

      - name: Show release plan
        working-directory: packages/bun-test-utils
        run: |
          echo "Will tag main as v${VERSION} and dispatch release.yml for npm Trusted Publishing."
          echo "The release commit will carry:"
          git status --short
          bun pm pack --dry-run

      - name: Commit and tag release
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            # The manifest bump and the consumed changeset files (ADR 0042).
            git add packages/bun-test-utils/package.json .changeset
            git commit -m "chore(release): prepare v${VERSION}"
            git push origin main
          fi
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      # A GITHUB_TOKEN tag push is recursion-suppressed, so dispatch the publish
      # workflow explicitly. It checks out the exact tag before publishing.
      - name: Dispatch publish workflow
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag="v${VERSION}"
